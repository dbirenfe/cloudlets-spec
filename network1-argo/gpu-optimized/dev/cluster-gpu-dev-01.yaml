hubApps:
  gpu-operator:
    source:
      path: app
      repoURL: https://github.com/dbirenfe/app-gpu-operator
      targetRevision: experiment/cuda-12
  monitoring-stack:
    source:
      path: app
      repoURL: https://github.com/dbirenfe/app-monitoring-stack
      targetRevision: feature/gpu-metrics
      helm:
        valueFiles:
        - values-gpu.yaml
edgeApps:
  nginx-ingress:
    source:
      path: app
      repoURL: https://github.com/dbirenfe/app-nginx-ingress
      helm:
        valueFiles:
        - values.yaml
      targetRevision: feature/rate-limiting
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
      syncOptions:
      - ServerSideApply=true
